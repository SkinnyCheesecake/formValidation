<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formValidation</title>
    
    <link rel="preload" href="./styles.css" as="styles">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="main">
        <div class="form">
            <h1 class="title">This is a form</h1>
            <form action="">
                <fieldset>
                    <div class="form__hero">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="nameField" placeholder="Your name goes here">
                        <label for="name">Email</label>
                        <input type="text" name="email" id="emailField" placeholder="Your email goes here">
                        <label for="name">Phone</label>
                        <input type="tel" name="phone" id="phoneField" placeholder="Your phone goes here">
                        <label for="name">Password</label>
                        <input type="password" name="password" id="passField" placeholder="Your password goes here">
                    </div>
            </form>
            </fieldset>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
